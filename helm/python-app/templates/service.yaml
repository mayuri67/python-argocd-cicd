apiVersion: apps/v1

kind: Deployment

metadata:
  name: python-app

spec:

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: python-app

  template:

    metadata:
      labels:
        app: python-app

    spec:

      containers:

        - name: python-app

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20